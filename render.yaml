# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
services:
  - type: web
    name: say-less
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GAME_PASSWORD   # you'll be asked to type this in when you deploy
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY  # optional — leave blank to use phones' speech recognition
        sync: false
